name: Overnight 工单
description: 用可核验的完成谓词开一条通宵任务。时长不是完成。
title: "overnight: "
labels: []
body:
  - type: markdown
    attributes:
      value: |
        完成 = 谓词 pass 或 fail。工时、通宵次数、「感觉做完了」都不是完成。
        卡住就停并写明原因，不放宽谓词。只开 PR，不自动合并。
        规范：`docs/OVERNIGHT_TICKET.md`
  - type: input
    id: slug
    attributes:
      label: slug
      description: 小写短名。分支与决策日志都用它：evidence/overnight-<slug>/decisions.tsv
      placeholder: alert-ack-audit
    validations:
      required: true
  - type: textarea
    id: predicate
    attributes:
      label: 完成谓词（pass/fail）
      description: 每条必须能判过或不过。写命令、退出码、测试名或文件路径。不要写时长。
      placeholder: |
        - [ ] `make gates` 退出码 0
        - [ ] `make test` 退出码 0
    validations:
      required: true
  - type: textarea
    id: isolation
    attributes:
      label: 隔离分支 / worktree
      description: 一条工单一个分支或 git worktree。不在 main 上直接改。
      placeholder: |
        分支：overnight/<slug>
        worktree：单独目录，或本机仅此一个工作树
    validations:
      required: true
  - type: input
    id: decisions
    attributes:
      label: 决策日志路径
      description: TSV 列 time, phase, decision, reason, evidence, result。只追加。
      placeholder: evidence/overnight-<slug>/decisions.tsv
    validations:
      required: true
  - type: checkboxes
    id: escape
    attributes:
      label: 逃生口
      description: 两条都要勾。勾选表示开工前接受该约束。
      options:
        - label: 卡住则停止，并在决策日志写明原因；不放宽谓词来换通过
          required: true
        - label: 只推 PR，不自动合并
          required: true
  - type: textarea
    id: scope
    attributes:
      label: 范围
      description: 这次要改的文件或行为。
    validations:
      required: true
  - type: textarea
    id: non_goals
    attributes:
      label: 非目标
      description: 明确不做的事。
    validations:
      required: false
