name: deliverable-gates
on:
  pull_request:
  push:
    branches: [main, master]
jobs:
  gates:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Run deliverable gates
        run: node scripts/gates/run-all.mjs
      - name: Run gate isomorphic selftest
        run: node scripts/gates/selftest.mjs
