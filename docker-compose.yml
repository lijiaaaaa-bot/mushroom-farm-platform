services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: mushroom
      POSTGRES_PASSWORD: mushroom
      POSTGRES_DB: mushroom
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U mushroom -d mushroom"]
      interval: 3s
      timeout: 3s
      retries: 30
  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 3s
      timeout: 3s
      retries: 30
  minio:
    # pgsty/silo：匿名可拉取，入口把 `server` 交给 silo。端口、MINIO_ROOT_* 与数据卷格式沿用。
    image: pgsty/silo:RELEASE.2026-09-16T00-00-00Z
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - ${MINIO_HOT_DATA:-minio-hot}:/data
  mosquitto:
    image: eclipse-mosquitto:2
    ports:
      - "1883:1883"
    volumes:
      - ./infra/mosquitto.conf:/mosquitto/config/mosquitto.conf:ro
    healthcheck:
      test:
        [
          "CMD",
          "mosquitto_pub",
          "-h",
          "127.0.0.1",
          "-p",
          "1883",
          "-t",
          "mushroom/health",
          "-m",
          "ok",
        ]
      interval: 3s
      timeout: 3s
      retries: 30

volumes:
  minio-hot:
